name: App Store Connect (avulso)

# Roda um dos scripts scripts/asc-*.mjs pela App Store Connect API, em Linux, sem Mac e sem
# gastar um build. Por padrao so LE e conta o que faria; escreve so com "aplicar" marcado.
#
#   certificados  lista os certificados; com aplicar, revoga os de desenvolvimento que o CI
#                 deixou ("Apple Development: Created via API"). O ios-release.yml ja faz isso
#                 sozinho antes e depois do archive.
#   testflight    leva o build informado ate os testadores: espera o processamento, confere a
#                 criptografia, grava o "O que testar" e libera para os grupos internos. O
#                 ios-release.yml ja faz isso sozinho no fim de cada envio.
#   loja          prepara a versao da App Store (versao do projeto, lancamento MANUAL): anexa o
#                 build informado, grava os textos de app-store/ e as informacoes de revisao
#                 (secret APPSTORE_REVISAO). So envia para a revisao com "enviar_revisao".
#   diagnosticos  relatorio de saude do app (metricas, assinaturas de diagnostico, crashes do
#                 TestFlight) como artefato "saude-do-app". So le. Roda sozinho toda semana pelo
#                 asc-diagnosticos.yml.
#
# O nome do arquivo ficou o antigo de proposito: workflow_dispatch so aparece para arquivo que
# existe no branch padrao, e assim da para rodar a versao de outro branch antes do merge.

on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: "O que rodar"
        required: true
        default: certificados
        type: choice
        options:
          - certificados
          - testflight
          - loja
          - diagnosticos
      aplicar:
        description: "Aplicar as mudancas (sem isto, so le e mostra o que faria)"
        required: false
        default: false
        type: boolean
      build:
        description: "testflight/loja: numero do build (ex.: 22)"
        required: false
        type: string
      o_que_testar:
        description: "testflight: texto do O que testar (pt-BR); vazio = nao mexe"
        required: false
        type: string
      versao:
        description: "loja: versao (vazio = a do projeto Xcode)"
        required: false
        type: string
      enviar_revisao:
        description: "loja: depois de preencher, ENVIAR para a revisao da Apple (lancamento continua manual)"
        required: false
        default: false
        type: boolean

jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rodar ${{ inputs.tarefa }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          TAREFA: ${{ inputs.tarefa }}
          APLICAR: ${{ inputs.aplicar }}
          BUILD: ${{ inputs.build }}
          O_QUE_TESTAR: ${{ inputs.o_que_testar }}
          ENVIAR_REVISAO: ${{ inputs.enviar_revisao }}
          VERSAO: ${{ inputs.versao }}
          APPSTORE_REVISAO: ${{ secrets.APPSTORE_REVISAO }}
        run: |
          set -e
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPSTORE_API_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export KEY_PATH O_QUE_TESTAR APPSTORE_REVISAO
          trap 'rm -f "$KEY_PATH"' EXIT
          case "$TAREFA" in
            certificados)
              if [ "$APLICAR" = "true" ]; then node scripts/asc-certificados.mjs --revogar
              else node scripts/asc-certificados.mjs; fi ;;
            testflight)
              # Lendo, nao espera o processamento: mostra o estado de agora.
              if [ "$APLICAR" = "true" ]; then node scripts/asc-testflight.mjs --build "$BUILD" --aplicar
              else node scripts/asc-testflight.mjs --build "$BUILD" --esperar-min 0; fi ;;
            loja)
              extra=()
              if [ -n "$BUILD" ]; then extra+=(--build "$BUILD"); fi
              if [ -n "$VERSAO" ]; then extra+=(--versao "$VERSAO"); fi
              if [ "$ENVIAR_REVISAO" = "true" ]; then node scripts/asc-loja.mjs "${extra[@]}" --enviar-revisao
              elif [ "$APLICAR" = "true" ]; then node scripts/asc-loja.mjs "${extra[@]}" --aplicar
              else node scripts/asc-loja.mjs "${extra[@]}" --mostrar-textos; fi ;;
            diagnosticos) node scripts/asc-diagnosticos.mjs --saida "$RUNNER_TEMP/saude" ;;
            *) echo "::error::tarefa desconhecida: $TAREFA"; exit 1 ;;
          esac

      - name: Guardar o relatorio de saude
        if: ${{ inputs.tarefa == 'diagnosticos' }}
        uses: actions/upload-artifact@v4
        with:
          name: saude-do-app
          path: ${{ runner.temp }}/saude
          if-no-files-found: error
          retention-days: 30

name: Saude do app (semanal)

# Toda segunda-feira, relatorio de saude do app pela App Store Connect API: metricas de
# desempenho e energia dos usuarios da loja, assinaturas de diagnostico dos ultimos builds e
# crashes enviados pelos testadores do TestFlight. So le.
#
# O log e publico (repositorio publico) e recebe so contagens. O relatorio fica no artefato
# "saude-do-app", sem e-mail, nome nem comentario de testador.

on:
  schedule:
    - cron: "0 12 * * 1" # segunda, 9h em Brasilia
  workflow_dispatch:

jobs:
  saude:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar o relatorio
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -e
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPSTORE_API_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export KEY_PATH
          trap 'rm -f "$KEY_PATH"' EXIT
          node scripts/asc-diagnosticos.mjs --saida "$RUNNER_TEMP/saude" --dias 30 --builds 3

      - name: Guardar o relatorio
        uses: actions/upload-artifact@v4
        with:
          name: saude-do-app
          path: ${{ runner.temp }}/saude
          if-no-files-found: error
          retention-days: 30

apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

kotlin {
    androidTarget {
        compilations.all {
            kotlinOptions.jvmTarget = '17'
        }
    }

    iosX64()
    iosArm64()
    iosSimulatorArm64()

    targets.withType(org.jetbrains.kotlin.gradle.plugin.mpp.KotlinNativeTarget).configureEach {
        binaries.framework {
            baseName = 'ComposeApp'
            isStatic = true
            binaryOption('bundleId', 'br.com.poporganize.shared')
        }
    }

    sourceSets {
        commonMain.dependencies {
            implementation compose.runtime
            implementation compose.foundation
            implementation compose.animation
            implementation compose.material3
            implementation compose.materialIconsExtended
            implementation compose.ui
            // Poppins vive em src/commonMain/composeResources/font. Sao os MESMOS arquivos que o
            // app Android ja embute em android/app/src/main/res/font -- nao ha fonte nova entrando
            // no projeto, nem licenca nova a resolver (Poppins e SIL OFL).
            implementation compose.components.resources
            implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
            implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.6.2'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
        }
    }
}

// O pacote e fixado para que a previa em desktop (preview-desktop/, fora do versionamento) gere a
// classe Res no MESMO pacote e possa compilar os fontes de commonMain sem alteracao nenhuma.
compose.resources {
    packageOfResClass = 'br.com.poporganize.shared.resources'
}

android {
    namespace = 'br.com.poporganize.shared'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

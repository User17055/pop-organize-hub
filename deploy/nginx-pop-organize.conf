# Limite de taxa para /api/health. O endpoint nao exige autenticacao e responde consultando o
# banco, entao sem teto qualquer pessoa pode transformar um GET barato em carga no MySQL.
#
# 30 por minuto por IP e folgado para qualquer monitoramento e inutil para inundar. A diretiva fica
# fora do bloco server porque limit_req_zone pertence ao contexto http -- e e onde este arquivo e
# incluido, por sites-enabled.
limit_req_zone $binary_remote_addr zone=pop_health:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name app.seudominio.com.br;

    server_tokens off;
    client_max_body_size 10m;

    location = /api/health {
        limit_req zone=pop_health burst=10 nodelay;
        # access_log segue desligado para o monitoramento nao encher o log, e isso nao esconde
        # ataque: o nginx registra as recusas do limit_req no error_log por conta propria, entao
        # uma inundacao aparece la.
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header X-Powered-By;
    }
}

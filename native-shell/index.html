<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Pop Organize</title>
    <style>
      :root {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #ffffff;
        color: #0f172a;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 20px 50px rgb(15 23 42 / 0.06);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pop Organize</h1>
      <p>
        Nao foi possivel carregar o aplicativo. Verifique sua conexao e tente novamente.
      </p>
    </main>
  </body>
</html>

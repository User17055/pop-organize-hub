<div class="app">
  <nav class="rail" aria-label="Áreas">
    <button class="railbtn side-toggle" id="collapseBtn" title="Ocultar painel lateral" aria-label="Ocultar painel lateral" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 6-6 6 6 6M18 6l-6 6 6 6"/></svg></button>
    <button class="railbtn" data-screen="dash" title="Painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></button>
    <button class="railbtn" data-screen="board" aria-current="true" title="Projetos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5M9 13h6M9 17h4"/></svg></button>
    <button class="railbtn" data-screen="cal" title="Calendário"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
    <hr>
    <button class="railbtn" title="Compartilhamentos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.3 10.8 7.4-4.3M8.3 13.2l7.4 4.3"/></svg></button>
    <button class="railbtn" title="Apontamento de horas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg></button>
    <button class="railbtn" title="Comentários"><span class="dot">2</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 2 1.4-4A8 8 0 1 1 21 12Z"/></svg></button>
    <div class="spacer"></div>
    <button class="mic" id="mic" title="Gravar nota de voz" aria-label="Gravar nota de voz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
    <button class="railbtn" title="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.6a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9.1A1.7 1.7 0 0 0 10.13 3V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.56 1.03Z"/></svg></button>
    <button class="railbtn" title="Suporte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13.5" width="4" height="6.5" rx="2"/><rect x="17.5" y="13.5" width="4" height="6.5" rx="2"/><path d="M20 20v.5a2.5 2.5 0 0 1-2.5 2.5H13"/></svg></button>
    <hr>
    <button class="railbtn out" title="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/><path d="m16 8 4 4-4 4M20 12H10"/></svg></button>
  </nav>

  <aside class="side" id="side" aria-label="Projetos">
    <div class="side-top">
      <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="q" type="text" placeholder="Buscar…" aria-label="Buscar tarefas">
    </div>
    <div class="side-scroll" id="sideScroll"></div>
    <div class="side-foot"><button class="newproj" id="newProjBtn">Novo projeto</button></div>
  </aside>

  <main class="main">
    <header class="head">
      <div class="head-row">
        <div class="titlewrap" id="headLeft"></div>
        <div class="topright">
          <div class="themepill" id="themePill">
            <button data-theme-set="dark" aria-current="true" title="Tema escuro" aria-label="Tema escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
            <button data-theme-set="light" title="Tema claro" aria-label="Tema claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg></button>
          </div>
          <button class="bell" id="bellBtn" title="Notificações" aria-label="Notificações"><span class="dot">10</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2 7.5-2 7.5h16s-2-1.5-2-7.5Z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg></button>
          <span class="me"><span class="av lg" style="--h:220">AR</span><span class="on" title="Online"></span></span>
        </div>
      </div>
    </header>

    <div class="screen" id="screenBoard">
    <section class="brief" id="brief"></section>

    <div class="tools">
      <div class="seg" id="viewSeg">
        <button data-view="kanban" aria-current="true">Kanban</button>
        <button data-view="lista">Lista</button>
        <button data-view="tabela">Tabela</button>
      </div>
      <button class="btn" id="filterBtn">Filtros <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h4M12 7h8M4 17h8M16 17h4"/><circle cx="10" cy="7" r="2.1"/><circle cx="14" cy="17" r="2.1"/></svg><span class="cnt" id="filterCount" hidden>0</span></button>
      <button class="btn solid" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Nova tarefa</button>
      <div class="push"></div>
      <div class="week">
        <button class="nav" data-wk="-1" title="Semana anterior" aria-label="Semana anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></button>
        <button class="lab" id="weekLab" aria-pressed="false" title="Mostrar só as tarefas com prazo nesta semana"><b id="weekRange"></b><span id="weekSub"></span></button>
        <button class="nav" data-wk="1" title="Próxima semana" aria-label="Próxima semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg></button>
      </div>
    </div>

    <div class="scroller" id="view"></div>
    </div>

    <div class="screen" id="screenDash" hidden>
      <div class="scroller" id="dash"></div>
    </div>

    <div class="screen" id="screenCal" hidden>
      <div class="scroller" id="cal"></div>
    </div>
  </main>
</div>
<div id="layer"></div>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Pop Organize - Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Poppins,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #dbe3ef;
        border-radius: 8px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 20px 50px rgb(15 23 42 / 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexao no momento</h1>
      <p>O Pop Organize esta instalado, mas precisa de internet para atualizar tarefas e prazos.</p>
    </main>
  </body>
</html>
